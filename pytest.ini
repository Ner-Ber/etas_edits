[pytest]
testpaths = tests
pythonpath = . runnable_code
markers =
    unit: fast tests; etas and runnable_code helpers without heavy third-party imports
    integration: cross-module runnable_code tests; may require pipeline or sibling repos
    heavy: full MAGNET_ETAS_pipeline stack (gin, TensorFlow); run manually or in CI only
addopts = --strict-markers
